<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0a09">
<meta name="description" content="Último Lume: um souls-like curto, de dez minutos, que roda no navegador.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Último Lume">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Último Lume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IM+Fell+English+SC&display=swap">
<style>
/* Tela única: o mundo vive no canvas; HUD, diálogos e menus são camadas DOM por cima. */
:root{
  color-scheme:dark;
  --ash:#0b0a09; --soot:#141110; --bone:#ddd4c2; --dim:#968b7a; --ember:#e48c3e; --blood:#a8281e; --moss:#6f8f48; --gold:#d4b26a;
  --line:rgba(221,212,194,.18); --panel:rgba(11,10,9,.92);
  --display:'IM Fell English SC','Cormorant SC',Georgia,'Times New Roman',serif;
  --body:'EB Garamond',Georgia,'Times New Roman',serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ash);overflow:hidden}
body{color:var(--bone);font-family:var(--body);font-size:16px;line-height:1.4;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
#game{position:fixed;inset:0;overflow:hidden;background:var(--ash)}
#cv{position:absolute;left:0;top:0;display:block}
.layer{position:absolute;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 50%,rgba(0,0,0,.62) 100%)}
#hurtfx{background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 42%,rgba(140,14,8,.6) 100%);opacity:0}

/* HUD */
#hud .bars{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));display:grid;gap:5px;justify-items:start}
.bar{position:relative;height:8px;max-width:min(44vw,420px);background:rgba(0,0,0,.62);border:1px solid rgba(221,212,194,.28);box-shadow:0 0 0 1px rgba(0,0,0,.55);overflow:hidden}
.bar i,.bar b{position:absolute;left:0;top:0;bottom:0;width:100%}
.bar.hp i,.bar.boss i{background:linear-gradient(#c43a2e,#7d1b14)}
.bar.hp b,.bar.boss b{background:#e2cf9e;opacity:.6}
.bar.st{height:6px}
.bar.st i{background:linear-gradient(#86a65a,#4b6630)}
#flask{display:flex;align-items:center;gap:5px;margin-top:2px;font-weight:600;font-size:15px;text-shadow:0 1px 2px #000;transition:opacity .2s;font-variant-numeric:tabular-nums}
#flask svg{width:16px;height:16px;color:var(--ember)}
#flask.empty{opacity:.4}
#flask.shake{animation:fshake .3s}
@keyframes fshake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
#souls{position:absolute;right:calc(62px + env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:7px;font-family:var(--display);font-size:20px;color:var(--gold);text-shadow:0 1px 3px #000;font-variant-numeric:tabular-nums}
#souls svg{width:11px;height:11px}
#soulGain{font-size:15px;color:var(--bone);opacity:0;transition:opacity .3s}
#bPause{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.4);pointer-events:auto;display:grid;place-items:center;cursor:pointer;padding:0}
#bPause svg{width:14px;height:14px}
#bPause:focus-visible{outline:1px solid var(--ember)}

#bossbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));width:min(600px,52vw);pointer-events:none}
.brow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-family:var(--display);font-size:16px;letter-spacing:.03em;text-shadow:0 1px 3px #000;margin-bottom:4px}
#bdmg{color:var(--bone);font-size:14px;font-variant-numeric:tabular-nums}
.bar.boss{max-width:none;width:100%;height:9px}
.bar.post{max-width:none;width:100%;height:3px;margin-top:3px;border-color:rgba(212,178,106,.3)}
.bar.post i{background:linear-gradient(90deg,#b98c2c,#f3d27a);width:0}
.bar.post.full{box-shadow:0 0 10px rgba(243,210,122,.8)}
#fade{background:#000;opacity:0;transition:opacity .6s}
#fade.on{opacity:1}
.tsnd{margin:10px 0 0;font-size:13px;letter-spacing:.1em;color:var(--ember);opacity:.85;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
body.touch #bossbar{width:min(520px,40vw)}
@media (orientation:portrait){#bossbar,body.touch #bossbar{bottom:auto;top:calc(86px + env(safe-area-inset-top,0px));width:calc(100vw - 32px)}}
@media (orientation:landscape) and (max-height:520px){#bossbar,body.touch #bossbar{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px));width:min(440px,36vw)}.bar:not(.boss){max-width:27vw}.brow{font-size:14px;margin-bottom:2px}}

#prompt{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;padding:9px 18px;background:var(--panel);border:1px solid rgba(228,140,62,.45);font-size:17px;pointer-events:auto;cursor:pointer;white-space:nowrap}
#prompt kbd{font-family:var(--display);color:var(--ember);font-size:16px}
body.touch #prompt{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
@media (orientation:landscape){body.touch #prompt{bottom:calc(24px + env(safe-area-inset-bottom,0px))}}

/* Faixas grandes: VOCÊ MORREU, FOGUEIRA ACESA, BRASA RECUPERADA */
#banner{display:grid;place-items:center;opacity:0;transition:opacity 1.1s ease}
#banner.show{opacity:1}
#banner span{display:block;width:100%;text-align:center;padding:clamp(14px,3vh,26px) 0;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.78) 22%,rgba(0,0,0,.78) 78%,rgba(0,0,0,0));font-family:var(--display);font-size:clamp(34px,7.5vw,78px);letter-spacing:.07em;line-height:1}
#banner.show span{animation:grow 3.4s ease-out both}
@keyframes grow{from{transform:scale(.94);letter-spacing:.02em}to{transform:scale(1);letter-spacing:.08em}}
#banner.red span{color:#b0261d;text-shadow:0 0 22px rgba(150,20,10,.45)}
#banner.ember span{color:var(--ember);text-shadow:0 0 22px rgba(228,140,62,.35)}
#banner.gold span{color:var(--gold);text-shadow:0 0 22px rgba(212,178,106,.35)}

#area{display:grid;justify-items:center;align-content:start;padding-top:max(17vh,62px);opacity:0;transition:opacity 1.2s}
#area.show{opacity:1}
#area span{font-family:var(--display);font-size:clamp(24px,4.6vw,46px);letter-spacing:.06em;padding:6px 28px;border-top:1px solid rgba(221,212,194,.3);border-bottom:1px solid rgba(221,212,194,.3);text-shadow:0 2px 8px #000;text-align:center;max-width:calc(100vw - 32px)}

#hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(58px + env(safe-area-inset-top,0px));max-width:calc(100vw - 32px);font-size:15px;color:var(--dim);text-align:center;text-shadow:0 1px 3px #000;opacity:0;transition:opacity 1s;text-wrap:balance}
#hint.show{opacity:1}
#hint.low{top:auto;bottom:calc(118px + env(safe-area-inset-bottom,0px));color:var(--gold);font-size:16px}
#hint b{color:var(--bone);font-weight:600}

/* Diálogo e itens */
.box{position:absolute;left:50%;transform:translateX(-50%);width:min(660px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.6);pointer-events:auto;cursor:pointer}
#dialog{bottom:calc(22px + env(safe-area-inset-bottom,0px));padding:14px 20px 16px}
#dwho{font-family:var(--display);color:var(--ember);font-size:16px;letter-spacing:.04em;margin-bottom:5px}
#dtext{font-size:clamp(17px,2.3vw,20px);line-height:1.45;max-width:62ch}
#dtext.in{animation:fadein .45s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.more{position:absolute;right:14px;bottom:8px;font-size:12px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
#itembox{top:50%;transform:translate(-50%,-50%);padding:20px 24px 26px;width:min(520px,calc(100vw - 32px));text-align:left}
#itembox .kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#iname{font-family:var(--display);font-size:clamp(22px,3.4vw,28px);color:var(--gold);margin:4px 0 10px;text-wrap:balance}
#idesc{font-style:italic;font-size:17px;line-height:1.5;color:var(--bone)}

/* Menus */
#menu{z-index:20;display:grid;place-items:center;background:rgba(0,0,0,.72);pointer-events:auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{width:min(420px,100%);max-height:calc(100% - 8px);overflow:auto;touch-action:pan-y;overscroll-behavior:contain;background:var(--panel);border:1px solid var(--line);box-shadow:0 16px 50px rgba(0,0,0,.7);padding:20px 22px 14px}
.panel h2{font-family:var(--display);font-weight:400;font-size:24px;color:var(--ember);margin:0 0 4px;letter-spacing:.03em;text-wrap:balance}
.panel .sub{margin:0 0 12px;color:var(--dim);font-size:15px}
.panel .copy{font-size:15px;line-height:1.5;margin:4px 0 12px}
.panel .copy h3{font-family:var(--display);font-weight:400;font-size:16px;color:var(--gold);margin:12px 0 4px}
.panel .copy p{margin:0}
.mbtn{display:flex;justify-content:space-between;align-items:baseline;gap:16px;width:100%;background:none;border:0;border-top:1px solid rgba(221,212,194,.09);padding:11px 8px;font-size:18px;text-align:left;cursor:pointer}
.mbtn .r{color:var(--dim);font-size:15px;font-variant-numeric:tabular-nums}
.mbtn:hover,.mbtn:focus-visible{background:rgba(228,140,62,.1);color:#fff;outline:none}
.mbtn:focus-visible{box-shadow:inset 3px 0 0 var(--ember)}
.mbtn.off{opacity:.42}

/* Controles de toque */
#touch{pointer-events:none}
#stickzone{position:absolute;left:0;top:0;bottom:0;width:46%;pointer-events:auto}
#stick{position:absolute;width:108px;height:108px;margin:-54px 0 0 -54px;border-radius:50%;border:1.5px solid rgba(221,212,194,.22);background:rgba(0,0,0,.16);opacity:.45;transition:opacity .15s}
#stick.on{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(221,212,194,.2);border:1px solid rgba(221,212,194,.3)}
.tb{position:absolute;pointer-events:auto;border-radius:50%;border:1.5px solid rgba(221,212,194,.3);background:rgba(12,10,9,.42);display:grid;place-items:center;padding:0;cursor:pointer;color:var(--bone)}
.tb svg{width:46%;height:46%}
.tb.on{background:rgba(228,140,62,.35);border-color:var(--ember)}
#bAtk{width:80px;height:80px;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px))}
#bRoll{width:64px;height:64px;right:calc(112px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#bHeal{width:52px;height:52px;right:calc(120px + env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px))}
#bLock{width:48px;height:48px;right:calc(34px + env(safe-area-inset-right,0px));bottom:calc(122px + env(safe-area-inset-bottom,0px))}

/* Telas: título, introdução, final */
.screen{display:grid;place-items:center;pointer-events:auto;text-align:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#title{align-content:start;padding-top:max(7vh,24px)}
.tcard{display:grid;justify-items:center;gap:4px}
.kicker{margin:0;font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--dim)}
.logo{margin:6px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(40px,min(11vw,15vh),118px);line-height:.95;letter-spacing:.06em;color:var(--bone);text-shadow:0 0 34px rgba(228,140,62,.22),0 2px 0 #000;text-wrap:balance}
.rule{width:min(260px,60vw);height:1px;background:linear-gradient(90deg,transparent,rgba(228,140,62,.6),transparent);margin:clamp(6px,2vh,14px) 0 clamp(4px,1.5vh,10px)}
@media (max-height:560px){.tfoot{display:none}#title{padding-top:max(4vh,14px)}}
@media (orientation:portrait) and (min-height:560px){#title{padding-top:16vh}}
.tmenu{display:grid;gap:2px;justify-items:center}
.tbtn{background:none;border:0;font-family:var(--display);font-size:clamp(19px,2.6vw,24px);letter-spacing:.06em;padding:clamp(3px,1vh,8px) 22px;cursor:pointer;color:var(--bone);opacity:.78;transition:opacity .2s,text-shadow .2s}
.tbtn:hover,.tbtn:focus-visible{opacity:1;outline:none;color:#fff;text-shadow:0 0 14px rgba(228,140,62,.7)}
.tfoot{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));margin:0;font-size:13px;color:var(--dim);letter-spacing:.04em;opacity:.8}
#intro{background:rgba(0,0,0,.35)}
#itext{max-width:30ch;font-size:clamp(20px,3.2vw,30px);line-height:1.45;font-style:italic;opacity:0;transition:opacity .9s;text-wrap:balance;margin:0}
#itext.on{opacity:1}
.skip{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:none;border:1px solid var(--line);padding:6px 14px;font-size:14px;color:var(--dim);cursor:pointer;letter-spacing:.08em}
.skip:hover,.skip:focus-visible{color:var(--bone);outline:none;border-color:var(--ember)}
#ending{opacity:0;transition:opacity 2.4s ease;background:#000}
#ending.warm{background:radial-gradient(ellipse at 50% 80%,#3a1c0a 0%,#0d0705 55%,#000 100%)}
#ending.show{opacity:1}
.ecard{max-width:36rem;display:grid;justify-items:center;gap:10px;max-height:100%;overflow:auto;touch-action:pan-y}
#eTitle{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,60px);letter-spacing:.05em;color:var(--gold);text-wrap:balance}
#ending.dark #eTitle{color:var(--bone)}
#eText{margin:0;font-size:clamp(17px,2.2vw,20px);line-height:1.55;font-style:italic;max-width:56ch}
#eStats{margin:6px 0 0;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.credit{margin:6px 0 0;font-size:12px;color:var(--dim);letter-spacing:.2em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){#banner.show span,#dtext.in{animation:none}}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>
  <div id="vig" class="layer"></div>
  <div id="hurtfx" class="layer"></div>

  <div id="hud" class="layer" hidden>
    <div class="bars">
      <div id="hpb" class="bar hp"><b id="hpl"></b><i id="hpf"></i></div>
      <div id="stb" class="bar st"><i id="stf"></i></div>
      <div id="flask"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2.5h6v2h-1v4.2l4.6 8.2a3 3 0 0 1-2.6 4.6H8a3 3 0 0 1-2.6-4.6L10 8.7V4.5H9z" fill="currentColor"/></svg><span id="flaskN">3</span></div>
    </div>
    <div id="souls"><span id="soulGain"></span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0l3.2 6L6 12 2.8 6z" fill="currentColor"/></svg><span id="soulsN">0</span></div>
  </div>
  <button id="bPause" aria-label="Pausa" hidden><svg viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1" width="3.2" height="12" fill="currentColor"/><rect x="8.8" y="1" width="3.2" height="12" fill="currentColor"/></svg></button>

  <div id="bossbar" hidden><div class="brow"><span id="bname"></span><span id="bdmg"></span></div><div class="bar boss"><b id="blag"></b><i id="bfill"></i></div><div id="bpostw" class="bar post"><i id="bpost"></i></div></div>
  <div id="fade" class="layer"></div>
  <div id="hint" class="layer"></div>
  <div id="area" class="layer"><span></span></div>
  <div id="banner" class="layer"><span></span></div>

  <div id="touch" class="layer" hidden>
    <div id="stickzone"></div>
    <div id="stick"><div id="knob"></div></div>
    <button id="bRoll" class="tb" aria-label="Rolar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 13.5A7.5 7.5 0 1 1 16.7 6M20 3.5v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="bHeal" class="tb" aria-label="Beber frasco"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2.5h6v2h-1v4.2l4.6 8.2a3 3 0 0 1-2.6 4.6H8a3 3 0 0 1-2.6-4.6L10 8.7V4.5H9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M7 15.5h10" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <button id="bLock" class="tb" aria-label="Travar mira"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><path d="M12 2v3.5M12 18.5V22M2 12h3.5M18.5 12H22" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <button id="bAtk" class="tb" aria-label="Atacar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 3.5h-3.2L6.6 13.7l3.7 3.7L20.5 7.2V4zM4.2 15.2l4.6 4.6M5.4 20.5l-2-2M7 17l-2.4 2.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>

  <div id="prompt" hidden><kbd id="pkey">E</kbd><span id="ptext"></span></div>

  <div id="dialog" class="box" hidden><div id="dwho"></div><div id="dtext"></div><span class="more">continuar</span></div>
  <div id="itembox" class="box" hidden><div class="kick">Obtido</div><div id="iname"></div><div id="idesc"></div></div>
  <div id="menu" class="layer" hidden></div>

  <div id="title" class="layer screen">
    <div class="tcard">
      <p class="kicker">Um souls-like de dez minutos</p>
      <h1 class="logo">Último Lume</h1>
      <div class="rule"></div>
      <nav class="tmenu">
        <button id="tContinue" class="tbtn" hidden>Continuar</button>
        <button id="tNew" class="tbtn">Novo jogo</button>
        <button id="tControls" class="tbtn">Controles</button>
        <button id="tSound" class="tbtn">Som: ligado</button>
        <button id="tCredits" class="tbtn">Créditos</button>
      </nav>
      <p id="tsnd" class="tsnd">Toque na tela para ouvir a música</p>
    </div>
    <p class="tfoot">Três guardiões. Três brasas. Uma fogueira.</p>
  </div>

  <div id="intro" class="layer screen" hidden><p id="itext"></p><button id="iskip" class="skip">Pular</button></div>

  <div id="ending" class="layer screen" hidden>
    <div class="ecard">
      <p class="kicker">Fim</p>
      <h2 id="eTitle"></h2>
      <p id="eText"></p>
      <p id="eStats"></p>
      <button id="eBack" class="tbtn">Voltar ao título</button>
      <p class="credit">Último Lume · jogo de teste</p>
    </div>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#cv'), ctx=cv.getContext('2d');
const lc=document.createElement('canvas'), lctx=lc.getContext('2d');
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const angTo=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);
function angDiff(a,b){let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;}
function turnTo(c,t,m){const d=angDiff(c,t);return c+clamp(d,-m,m);}
function hash(x,y){let h=(Math.imul(x,374761393)+Math.imul(y,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}

function block(x,y,w,h,t){for(let j=0;j<h;j++)for(let i=0;i<w;i++)map[(y+j)*MW+x+i]=t;}
function blob(cx,cy,rx,ry,t){for(let y=Math.floor(cy-ry);y<=cy+ry;y++)for(let x=Math.floor(cx-rx);x<=cx+rx;x++){const dx=(x-cx)/rx,dy=(y-cy)/ry;if(dx*dx+dy*dy<=1&&map[y*MW+x]!==T.WALL)map[y*MW+x]=t;}}
function tileAt(tx,ty){return (tx<0||ty<0||tx>=MW||ty>=MH)?T.WALL:map[ty*MW+tx];}
function solidTile(tx,ty){const t=tileAt(tx,ty);return t===T.WALL||t===T.PILLAR;}
function solidAt(x,y){return solidTile(Math.floor(x/TILE),Math.floor(y/TILE));}
function zoneAt(x,y){const tx=Math.floor(x/TILE),ty=Math.floor(y/TILE);if(tx<0||ty<0||tx>=MW||ty>=MH)return 0;return zmap[ty*MW+tx];}

    AU.sfx=c.createGain();AU.sfx.gain.value=.9;AU.sfx.connect(AU.master);

    const len=c.sampleRate,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.noise=buf;
    const src=c.createBufferSource();src.buffer=buf;src.loop=true;

    const g=c.createGain();g.gain.value=.018;
    const lfo=c.createOscillator();lfo.frequency.value=.08;const lg=c.createGain();lg.gain.value=170;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();

  s.connect(f);f.connect(g);g.connect(o.dest||AU.sfx);s.start(t0,Math.random()*.5);s.stop(t0+o.dur+.05);}

  for(const f of fogs)if(!f.gone&&!(e===P&&P.state==='fog'))pushRect(e,f.x,f.y,f.w,f.h);

function stepE(e,a,s,dt){return moveE(e,Math.cos(a)*s*dt,Math.sin(a)*s*dt);}
function updEnemy(e,dt){
  const d=e.def;e.flash=Math.max(0,e.flash-dt);e.t-=dt;e.cd-=dt;e.tele=null;
  if(e.type==='wisp'){updWisp(e,dt);return;}
  const pd=dist(e,P),pa=angTo(e,P),pdead=P.state==='dead',wm=inWater(e)?.6:1;
  if(pdead&&e.state!=='idle'&&e.state!=='return')e.state='return';

    case 'idle': if(!pdead&&pd<d.aggro&&los(e,P)){e.state='chase';e.cd=Math.max(e.cd,.35);enemyVoice(e,'aggro');}break;
    case 'return':{const ha=Math.atan2(e.hy-e.y,e.hx-e.x),hd=Math.hypot(e.hx-e.x,e.hy-e.y);

    case 'chase':{
      const hd=Math.hypot(e.hx-e.x,e.hy-e.y);

      if(e.type==='archer'){archerChase(e,pd,pa,dt,wm);break;}
      e.face=turnTo(e.face,pa,(d.track+2)*dt);
      if(pd>d.reach*.75)stepE(e,e.face,d.speed*wm,dt);
      if(pd<d.reach&&e.cd<=0&&Math.abs(angDiff(e.face,pa))<.5){e.state='wind';e.t=e.wt=d.wind;enemyVoice(e,'wind');}
      break;}
    case 'wind':{
      if(e.t>e.wt*.25)e.face=turnTo(e.face,pa,d.track*dt);
      e.tele=e.type==='dog'?{k:'line',len:60,w:8,p:1-e.t/e.wt}:{k:'arc',r:d.range,h:d.half,p:1-e.t/e.wt};

      break;}
    case 'rec': if(e.t<=0){e.state='chase';e.cd=d.cd*rnd(.6,1.3);}break;
    case 'aim':{
      if(e.t>.22)e.aim=turnTo(e.aim,pa,2.5*dt);e.face=e.aim;e.tele={k:'ray',len:170,p:1-e.t/e.wt};
      if(e.t<=0){projs.push({x:e.x+Math.cos(e.aim)*7,y:e.y+Math.sin(e.aim)*7,vx:Math.cos(e.aim)*170,vy:Math.sin(e.aim)*170,r:2.5,dmg:d.dmg,life:2,k:'arrow'});sfx('arrow');e.state='rec';e.t=.5;}
      break;}
    case 'stagger':{moveE(e,e.kbx*dt,e.kby*dt);const f=Math.exp(-8*dt);e.kbx*=f;e.kby*=f;if(e.t<=0){e.state='chase';e.cd=Math.max(e.cd,.25);}break;}
  }
}
function archerChase(e,pd,pa,dt,wm){
  const d=e.def;e.face=turnTo(e.face,pa,5*dt);

/* ================= JOGADOR ================= */
function shake(v){G.shake=Math.max(G.shake,v*.6);}
function gainCinzas(n){P.cinzas+=n;G.soulGain+=n;G.soulGainT=1.8;}
function hurtPlayer(dmg,src){
  const p=P;if(G.god||p.state==='dead'||p.state==='fog'||p.state==='sit'||p.iframe>0||G.mode!=='play')return false;
  if(p.state==='roll'&&p.t>=p.iwin[0]&&p.t<=p.iwin[1])return false;
  p.hp-=dmg;G.hurtFx=.65;G.lagT=.6;shake(3+dmg*.08);sfx('hurt');G.hitStop=Math.max(G.hitStop,.07);
  spawnP(p.x,p.y,10,{smin:20,smax:60,col:'#7d1712',lmin:.3,lmax:.7,drag:3,szmax:1.8});
  if(p.hp<=0){p.hp=0;killPlayer();return true;}
  const a=Math.atan2(p.y-src.y,p.x-src.x);p.kbx=Math.cos(a)*130;p.kby=Math.sin(a)*130;p.state='hurt';p.t=0;p.iframe=.55;p.healDone=true;
  return true;
}
function killPlayer(){
  const p=P;p.state='dead';p.t=0;p.lock=null;G.deaths++;sfx('death');musicStop(2);
  G.stain=p.cinzas>0?{x:p.x,y:p.y,n:p.cinzas}:null;p.cinzas=0;G.soulsShown=0;

  after(1,()=>banner('VOCÊ MORREU','red',3.3));
  after(4.1,()=>ui.fade.classList.add('on'));
  after(4.75,()=>{respawn();ui.fade.classList.remove('on');});
}
function respawn(){
  const b=G.bonfire>=0?BONF[G.bonfire]:null;
  P.x=b?b.x:START.x;P.y=b?b.y+16:START.y;P.face=-Math.PI/2;
  refill();P.state='idle';P.t=0;P.iframe=1.2;P.lock=null;P.kbx=P.kby=0;

}
function refill(){P.hp=maxHp();P.st=maxSt();P.flasks=P.maxFlasks;G.hpLag=P.hp;}
function resetWorld(){
  enemies=SPAWNS.map(s=>makeEnemy(...s));projs.length=0;hazards.length=0;
  for(let i=0;i<3;i++)bosses[i]=G.bossDown[i]?null:makeBoss(i);
  G.activeBoss=null;musicStop(1);
  fogs.forEach(f=>f.gone=G.bossDown[f.b]);
  gates.forEach(g=>{g.open=G.bossDown[g.b]?1:0;g.opening=false;});
}
function toggleLock(){
  if(P.lock){P.lock=null;return;}
  let best=null,bd=200;for(const e of targets(false)){const d=dist(P,e);if(d<bd&&los(P,e)){bd=d;best=e;}}
  P.lock=best;if(best)sfx('ui');
}
function autoAim(want){let best=null,bs=1e9;for(const e of targets(true)){const d=dist(P,e)-e.r;if(d>44)continue;const ad=Math.abs(angDiff(want,angTo(P,e)));if(ad>1.7)continue;const s=d+ad*20;if(s<bs){bs=s;best=e;}}return best;}
function startRoll(mv,moving){
  const p=P;p.state='roll';p.t=0;p.stDelay=.55;
  if(moving){p.backstep=false;p.rollDur=.44;p.rdx=mv.x/mv.l;p.rdy=mv.y/mv.l;p.st-=22;if(!p.lock)p.face=Math.atan2(p.rdy,p.rdx);p.iwin=[.03,.32];}
  else{p.backstep=true;p.rollDur=.26;p.rdx=-Math.cos(p.face);p.rdy=-Math.sin(p.face);p.st-=12;p.iwin=[.02,.16];}
  sfx('roll');
}
function startAttack(c,mv,moving){
  const p=P,strong=c===2;p.state='attack';p.t=0;p.combo=c;p.stDelay=.55;p.st-=strong?22:15;
  p.atk={wind:c===0?.12:.08,act:.1,rec:strong?.34:.24,dmg:Math.round(pDmg()*(strong?1.45:1)),range:strong?27:23,half:strong?1.55:1.15,step:strong?75:48,dir:c===1?-1:1,hit:new Set(),fired:false,fired2:false};
  let tgt=p.lock;if(!tgt)tgt=autoAim(moving?Math.atan2(mv.y,mv.x):p.face);
  if(tgt)p.face=angTo(p,tgt);else if(moving)p.face=Math.atan2(mv.y,mv.x);
}
function startHeal(){const p=P;if(p.flasks<=0){sfx('ui');const f=$('#flask');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');return;}p.state='heal';p.t=0;p.healDone=false;}
function playerHits(a){for(const e of targets(true)){if(a.hit.has(e)||e.invuln)continue;if(inArc(P,P.face,a.range,a.half,e)){a.hit.add(e);damageEnemy(e,a.dmg);}}}
function damageEnemy(e,dmg){
  let crit=false;if(e.boss&&e.state==='broken'){dmg=Math.round(dmg*1.5);crit=true;}
  e.hp-=dmg;e.flash=.12;G.hitStop=Math.max(G.hitStop,crit?.12:e.boss?.06:.045);shake(crit?4:e.boss?2.2:1.4);sfx('hit');
  const a=angTo(P,e);spawnP(e.x,e.y,8,{ang:a,spread:.8,smin:20,smax:70,col:e.boss?'#b8a68a':'#8d877c',lmin:.25,lmax:.6,drag:4,szmax:1.8});
  if(crit){spawnP(e.x,e.y,16,{ang:a,spread:.6,smin:40,smax:120,col:'#ffd890',glow:true,lmin:.2,lmax:.5,drag:3});smp('crunch',{vol:.8,rate:.8});}
  if(e.boss){G.bossDmg+=dmg;G.bossDmgT=1.8;smp('crunch',{vol:.28,jit:.12});bossHurtVoice(e);
    if(!crit&&!e.invuln&&!['trans','roar','shriek','blink_out','blink_in','broken','wait'].includes(e.state)){e.posture+=dmg;e.postureT=1.8;
      if(e.posture>=e.postureMax&&e.hp>dmg){e.posture=0;e.alpha=1;bset(e,'broken',1.5);e.tele=null;sfx('boom',.5);shake(5);spawnP(e.x,e.y,20,{smin:20,smax:80,col:'#f3d27a',glow:true,lmin:.3,lmax:.7});
        if(!G.toldBreak){G.toldBreak=true;toast('Postura quebrada! Ataque agora para um golpe crítico.');}}}}
  else{if(e.type==='knight')smp('crunch',{vol:.3,jit:.12});if(e.state==='idle'||e.state==='return'){e.state='chase';enemyVoice(e,'aggro');}e.poise++;if(e.poise>=e.def.poise){e.poise=0;e.state='stagger';e.t=.24;e.kbx=Math.cos(a)*70;e.kby=Math.sin(a)*70;}}
  if(e.hp<=0){if(e.boss)bossDefeated(e);else killEnemy(e);}
}
function killEnemy(e){
  e.alive=false;if(e.def.cinzas)gainCinzas(e.def.cinzas);sfx('kill');enemyVoice(e,'die');
  spawnP(e.x,e.y,22,{smin:5,smax:30,col:'#a39b8e',lmin:.6,lmax:1.4,up:18,drag:1.5,szmax:2});
  spawnP(e.x,e.y,6,{smin:5,smax:20,col:'#e28b3d',lmin:.4,lmax:.9,up:25,glow:true,szmax:1.3});
}
function crossFog(f){P.state='fog';P.t=0;P.fog=f;P.lock=null;sfx('fog');}
function updPlayer(dt){
  const p=P;p.t+=dt;if(p.iframe>0)p.iframe-=dt;
  const mv=moveVec(),moving=mv.l>.15;
  if(p.lock&&(!p.lock.alive||dist(p,p.lock)>240))p.lock=null;
  if(p.state!=='dead'&&p.state!=='sit'&&consume('lock'))toggleLock();
  p.stDelay-=dt;
  if(p.stDelay<=0&&p.state!=='roll'&&p.state!=='attack')p.st=Math.min(maxSt(),p.st+(p.state==='heal'?22:60)*dt);
  const wm=inWater(p)?.62:1;
  switch(p.state){
    case 'idle':case 'walk':{
      if(!rollHeld())p.sprintLock=false;
      const sprint=moving&&rollHeld()&&!p.sprintLock&&p.st>0&&!p.lock;
      if(sprint){p.st-=26*dt;p.stDelay=.45;if(p.st<=0)p.sprintLock=true;if(Math.random()<dt*14)spawnP(p.x,p.y+4,1,{smin:3,smax:10,col:'#6b6458',lmin:.2,lmax:.4});}
      p.sprinting=sprint;
      const spd=70*wm*(p.lock?.82:1)*(sprint?1.55:1);
      if(moving){p.state='walk';if(!p.lock)p.face=Math.atan2(mv.y,mv.x);moveE(p,mv.x*spd*dt,mv.y*spd*dt);p.stepT-=dt*(sprint?1.5:1)*mv.l;if(p.stepT<=0){p.stepT=.36;footstep();}}else{p.state='idle';p.stepT=.1;}
      if(p.lock)p.face=angTo(p,p.lock);
      if(consume('roll')){if(p.st>0)startRoll(mv,moving);}
      else if(consume('atk')){if(p.st>0)startAttack(0,mv,moving);}
      else if(consume('heal'))startHeal();
      else if(consume('act')){if(G.interact)G.interact.fn();}
      break;}
    case 'roll':{
      const k=p.t/p.rollDur,spd=p.backstep?lerp(150,40,k):lerp(205,60,k*k);
      moveE(p,p.rdx*spd*wm*dt,p.rdy*spd*wm*dt);
      if(Math.random()<dt*25)spawnP(p.x,p.y+4,1,{smin:3,smax:12,col:'#6b6458',lmin:.2,lmax:.4});
      if(p.t>=p.rollDur){p.state='idle';p.t=0;}
      break;}
    case 'attack':{
      const a=p.atk,tA=a.wind,tB=tA+a.act,tC=tB+a.rec;
      if(p.t<tA){if(p.lock)p.face=angTo(p,p.lock);}
      else if(p.t<tB){if(!a.fired){a.fired=true;sfx('swing');}moveE(p,Math.cos(p.face)*a.step*dt,Math.sin(p.face)*a.step*dt);playerHits(a);}
      else if(p.t<tC){
        if(!a.fired2){a.fired2=true;playerHits(a);}
        if(p.t>tB+.04){if(p.combo<2&&p.st>0&&consume('atk',.35)){startAttack(p.combo+1,mv,moving);break;}if(p.st>0&&consume('roll',.35)){startRoll(mv,moving);break;}}
      }else{p.state='idle';p.t=0;}
      break;}
    case 'heal':{
      moveE(p,mv.x*24*dt,mv.y*24*dt);
      if(!p.healDone&&p.t>.55){p.healDone=true;p.flasks--;p.hp=Math.min(maxHp(),p.hp+Math.round(maxHp()*.42)+12);sfx('heal');spawnP(p.x,p.y,16,{col:'#f0c060',smin:5,smax:25,lmin:.5,lmax:1,up:30,glow:true,szmax:1.6});}
      if(p.t>1){p.state='idle';p.t=0;}
      break;}
    case 'hurt':{moveE(p,p.kbx*dt,p.kby*dt);const f=Math.exp(-9*dt);p.kbx*=f;p.kby*=f;if(p.t>.3){p.state='idle';p.t=0;}break;}
    case 'fog':{const f=p.fog;moveE(p,f.dx*40*dt,f.dy*40*dt);
      const past=f.dx>0?p.x>f.x+f.w+p.r+1:f.dx<0?p.x<f.x-p.r-1:p.y>f.y+f.h+p.r+1;
      if(past||p.t>2.5){p.state='idle';p.t=0;p.fog=null;activateBoss(f.b);}break;}
  }
}

/* ================= PROJÉTEIS E PERIGOS ================= */
function updProjs(dt){
  for(const p of projs){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(solidAt(p.x,p.y)){p.life=0;spawnP(p.x,p.y,4,{smin:10,smax:30,col:p.k==='orb'?'#cfc0ff':'#cbb994',lmin:.15,lmax:.3,glow:p.k==='orb'});continue;}
    if(P.state!=='dead'&&Math.hypot(P.x-p.x,P.y-p.y)<P.r+p.r){if(hurtPlayer(p.dmg,p))p.life=0;}}
  projs=projs.filter(p=>p.life>0);
}
function updHaz(dt){
  for(const h of hazards){
    if(h.k==='ring'){if(h.delay>0){h.delay-=dt;continue;}h.r+=h.spd*dt;
      if(h.dmg>0&&!h.hit&&P.state!=='dead'){const dd=Math.hypot(P.x-h.x,P.y-h.y);if(Math.abs(dd-h.r)<5+P.r*.5){h.hit=hurtPlayer(h.dmg,h)||h.hit;}if(dd<h.r-10)h.hit=true;}
      if(h.r>=h.rmax)h.done=true;}
    else{h.t+=dt;
      if(!h.fired&&h.t>=h.delay){h.fired=true;if(P.state!=='dead'&&Math.hypot(P.x-h.x,P.y-h.y)<h.r+P.r*.4)hurtPlayer(h.dmg,h);

function stepGame(dt){
  updTimers(dt);
  updPlayer(dt);
  for(const e of enemies)if(e.alive)updEnemy(e,dt);
  enemies=enemies.filter(e=>e.alive);
  const b=G.activeBoss;if(b&&b.alive)updBoss(b,dt);
  updProjs(dt);updHaz(dt);updParts(dt);ambientParts(dt);
  separate();
  for(const g of gates)if(g.opening&&g.open<1)g.open=Math.min(1,g.open+dt*.7);
  // câmera
  let tx=P.x+Math.cos(P.face)*10,ty=P.y+Math.sin(P.face)*8;
  if(b&&b.alive){const d=dist(P,b);if(d<300){tx=lerp(tx,b.x,.42);ty=lerp(ty,b.y,.42);}}
  const k=1-Math.exp(-6*dt);G.cam.x+=(tx-G.cam.x)*k;G.cam.y+=(ty-G.cam.y)*k;G.shake=Math.max(0,G.shake-dt*18);
  // zona
  const z=zoneAt(P.x,P.y);if(z!==G.curZone){G.curZone=z;if(!G.zoneSeen[z]){G.zoneSeen[z]=1;areaTitle(ZONE_NAMES[z]);}}
  const A=[[4,3,8,.85],[12,12,18,.55],[6,12,10,.7],[6,4,10,.8]][z];const ka=1-Math.exp(-1.5*dt);for(let i=0;i<4;i++)G.amb[i]+=(A[i]-G.amb[i])*ka;
  if(G.curZone===Z.YARD){G.boltT-=dt;if(G.boltT<=0){G.boltT=rnd(13,24);G.flash=1;after(rnd(.4,1.1),()=>smp('thunder',{vol:.5,rate:rnd(.8,1)}));}
    G.ravenT-=dt;if(G.ravenT<=0){G.ravenT=rnd(9,18);smp('raven',{vol:.3,rate:rnd(.9,1.1)});}}
  G.flash=Math.max(0,G.flash-dt*2.2);G.quietT=Math.max(0,G.quietT-dt);
  checkStain();
  G.interact=(P.state==='idle'||P.state==='walk')&&!G.activeBoss?findInteract():null;
  G.crackT-=dt;if(G.crackT<=0){G.crackT=rnd(.08,.3);for(let i=0;i<3;i++)if(G.lit[i]){const d=Math.hypot(P.x-BONF[i].x,P.y-BONF[i].y);if(d<110)sfx('crackle',1.2-d/110);}}
}
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;if(!(dt>0))dt=.016;dt=Math.min(dt,.05);
  G.clock+=dt;pollPad();
  if(G.mode==='play'){
    if(consume('pause'))openPause();
    else{if(G.hitStop>0)G.hitStop-=dt;else stepGame(dt);G.time+=dt;}
  }else if(G.mode==='dialog'){if(consume('ok')||consume('act')||consume('atk'))dlgNext();}
  else if(G.mode==='intro'){G.introT+=dt;if(G.introT>4.4)introNext();}
  if(G.mode==='title'||G.mode==='intro'||(G.mode==='menu'&&G.menuRet==='title'))updTitleParts(dt);
  updHUD(dt);render();musicTick();updAudio();
  if(AU.ctx&&!ui.tsnd.hidden)ui.tsnd.hidden=true;
}

function resetState(){
  Object.assign(G,{time:0,deaths:0,bossDown:[false,false,false],lit:[false,false,false],bonfire:-1,items:{},ioneSeen:[false,false,false,false],zoneSeen:{},curZone:-1,stain:null,activeBoss:null,altarLit:false,soulsShown:0,soulGain:0,soulGainT:0,shake:0,hitStop:0,amb:[4,3,8,.88]});
  Object.assign(P,{vig:0,str:0,end:0,cinzas:0,maxFlasks:3,lock:null,state:'idle',t:0,iframe:0});
  timers.length=0;parts=[];menuStack=[];
}
function toTitle(){menuStack=[];ui.menu.hidden=true;ui.menu.replaceChildren();ui.dlg.hidden=true;ui.item.hidden=true;ui.ending.hidden=true;ui.ending.classList.remove('show');ui.intro.hidden=true;
  ui.title.hidden=false;setMode('title');musicStop(.5);timers.length=0;G.quietT=0;ui.fade.classList.remove('on');refreshTitle();if(!G.touch)$(loadSave()?'#tContinue':'#tNew').focus({preventScroll:true});}
function refreshTitle(){$('#tContinue').hidden=!loadSave();txt($('#tSound'),'Som: '+(AU.on?'ligado':'desligado'));}
function goFull(){if(!G.touch)return;try{const el=document.documentElement;const p=el.requestFullscreen?el.requestFullscreen():null;if(p&&p.then)p.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>{});}catch(e){}}
function newGame(){resetState();store.del(SAVE_KEY);ui.title.hidden=true;setMode('intro');ui.intro.hidden=false;G.introI=-1;introNext();}
function introNext(){if(G.mode!=='intro')return;G.introI++;G.introT=0;if(G.introI>=INTRO.length){startPlay();return;}ui.itext.classList.remove('on');setTimeout(()=>{ui.itext.textContent=INTRO[G.introI];ui.itext.classList.add('on');},G.introI?350:50);}
function startPlay(){ui.intro.hidden=true;ui.title.hidden=true;setMode('play');respawn();P.face=0;G.cam.x=P.x;G.cam.y=P.y;clearTimeout(hintTO);hintTO=setTimeout(showHint,3600);}
function continueGame(){
  const s=loadSave();if(!s){newGame();return;}resetState();
  G.bonfire=s.bonfire??-1;G.lit=s.lit||G.lit;G.bossDown=s.bossDown||G.bossDown;G.items=s.items||{};G.deaths=s.deaths||0;G.time=s.time||0;G.ioneSeen=s.ioneSeen||G.ioneSeen;G.zoneSeen=s.zoneSeen||{};
  Object.assign(P,{cinzas:s.cinzas||0,vig:s.vig||0,str:s.str||0,end:s.end||0,maxFlasks:s.maxFlasks||3});G.soulsShown=P.cinzas;
  ui.title.hidden=true;setMode('play');respawn();const z=zoneAt(P.x,P.y);G.curZone=z;areaTitle(G.bonfire>=0?BONF[G.bonfire].name:ZONE_NAMES[z]);clearTimeout(hintTO);hintTO=setTimeout(showHint,3600);
}
function ending(k){
  G.endingK=k;menuStack=[];ui.menu.hidden=true;ui.menu.replaceChildren();setMode('ending');musicStop(2);
  if(k===0){G.altarLit=true;sfx('bonfire');sfx('victory');}else sfx('death');
  const E=ENDINGS[k];txt($('#eTitle'),E.title);txt($('#eText'),E.text);txt($('#eStats'),`Tempo ${fmtTime(G.time)} · Mortes ${G.deaths} · Nível ${level()}`);
  ui.ending.className='layer screen '+(k?'dark':'warm');ui.ending.hidden=false;setTimeout(()=>ui.ending.classList.add('show'),k===0?1400:300);store.del(SAVE_KEY);
  setTimeout(()=>{if(!G.touch)$('#eBack').focus({preventScroll:true});},2600);
}
$('#tNew').addEventListener('click',()=>{auInit();goFull();newGame();});
$('#tContinue').addEventListener('click',()=>{auInit();goFull();continueGame();});
$('#tSound').addEventListener('click',()=>{auInit();setSound(!AU.on);refreshTitle();});
$('#tControls').addEventListener('click',()=>{auInit();openMenu(controlsMenu(),'title');});
$('#tCredits').addEventListener('click',()=>{auInit();openMenu(creditsMenu(),'title');});
$('#iskip').addEventListener('click',e=>{e.stopPropagation();startPlay();});
ui.intro.addEventListener('click',()=>introNext());
$('#eBack').addEventListener('click',()=>toTitle());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.mode==='play'&&P.state!=='dead')openPause();try{if(AU.ctx){if(document.hidden)AU.ctx.suspend();else AU.ctx.resume();}}catch(e){}});

/* gancho de teste */
window.__LL={G,P,bosses,fogs,gates,ARENAS,BONF,get enemies(){return enemies},get hazards(){return hazards},get projs(){return projs},
  tp(tx,ty){P.x=W(tx);P.y=W(ty);G.cam.x=P.x;G.cam.y=P.y;},stepGame,damageEnemy,crossFog,useBonfire,openPause,closeMenu,newGame,startPlay,continueGame,ending,toTitle,save,loadSave,respawn,
  press,setTouch,setMode,findInteract:()=>findInteract(),activateBoss,setMove(x,y){pad.x=x;pad.y=y;},get timers(){return timers},AU,AS,MD,AMB,hold,auInit};

resize();addEventListener('resize',resize);
refreshTitle();if(!G.touch)$('#tNew').focus({preventScroll:true});
requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame);});
})();
</script>

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
