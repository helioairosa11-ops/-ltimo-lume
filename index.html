<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050407">
<meta name="description" content="Último Lume: um metroidvania sombrio com alma de souls-like, que corre no navegador.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Último Lume">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Último Lume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IM+Fell+English+SC&display=swap">
<style>
/* Mundo 2D no canvas; HUD, diálogos e menus em camadas por cima. */
:root{
  color-scheme:dark;
  --ash:#050407; --bone:#e6dcc8; --dim:#9a8f7e; --ember:#e8913f; --blood:#b3261c; --gold:#d8b46a; --lume:#f2c46a; --soul:#8fc0ff; --line:rgba(230,220,200,.16); --panel:rgba(7,6,9,.94);
  --display:'IM Fell English SC','Cormorant SC',Georgia,'Times New Roman',serif;
  --body:'EB Garamond',Georgia,'Times New Roman',serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ash);overflow:hidden}
body{color:var(--bone);font-family:var(--body);font-size:16px;line-height:1.4;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}
.layer{position:fixed;inset:0;pointer-events:none}
#hurt{background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 45%,rgba(140,10,6,.6) 100%);opacity:0}
#flashL{background:#fff6e0;opacity:0;mix-blend-mode:screen}
#fade{background:#000;opacity:0;transition:opacity .55s;z-index:30}
#fade.on{opacity:1}
/* ---------- HUD ---------- */
#hud .tl{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:center}
#orb{position:relative;width:54px;height:54px;flex:none}
#orb canvas{width:54px;height:54px;display:block}
#hud .col{display:grid;gap:5px}
.bar{position:relative;height:10px;width:180px;background:rgba(0,0,0,.65);border:1px solid rgba(230,220,200,.28);box-shadow:0 0 0 1px rgba(0,0,0,.7);overflow:hidden}
.bar i,.bar b{position:absolute;left:0;top:0;bottom:0;width:100%;transform-origin:left;}
.bar.hp i{background:linear-gradient(#d24434,#801b12)} .bar.hp b{background:#f0dfae;opacity:.6}
#flasks{display:flex;gap:4px;align-items:center;min-height:16px}
#flasks span{width:9px;height:14px;border-radius:2px 2px 4px 4px;background:linear-gradient(#ffcf7a,#d0742c);box-shadow:0 0 6px rgba(255,170,80,.6)}
#flasks span.e{background:rgba(120,110,100,.35);box-shadow:none}
#spell{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);min-height:14px}
#cinzas{position:fixed;right:calc(112px + env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:7px;font-family:var(--display);font-size:20px;color:var(--gold);text-shadow:0 1px 3px #000;font-variant-numeric:tabular-nums}
#cinzas svg{width:11px;height:11px}
#cgain{font-size:15px;color:var(--bone);opacity:0;transition:opacity .3s}
#combo{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));text-align:right;font-family:var(--display);opacity:0;transition:opacity .25s;text-shadow:0 2px 6px #000}
#combo.show{opacity:1}
#combo .n{font-size:34px;color:#fff3d6;line-height:1}
#combo .k{font-size:12px;letter-spacing:.24em;color:var(--ember)}
#combo.pop .n{animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(1.35)}to{transform:scale(1)}}
.ib{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.45);pointer-events:auto;display:grid;place-items:center;cursor:pointer;padding:0;z-index:6}
.ib svg{width:16px;height:16px}
#bPause{right:calc(12px + env(safe-area-inset-right,0px))}
#bInv{right:calc(60px + env(safe-area-inset-right,0px))}
/* chefe */
#boss{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(620px,58vw)}
#bname{font-family:var(--display);font-size:18px;letter-spacing:.04em;text-shadow:0 1px 3px #000;margin-bottom:4px;text-align:center}
.bar.boss{width:100%;height:9px} .bar.boss i{background:linear-gradient(#d24434,#801b12)} .bar.boss b{background:#f0dfae;opacity:.6}
.bar.post{width:100%;height:3px;margin-top:3px;border-color:rgba(216,180,106,.3)} .bar.post i{background:linear-gradient(90deg,#b98c2c,#f3d27a);transform:scaleX(0)}
body.touch #boss{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px));width:min(420px,40vw)}
body.touch #bname{font-size:14px;margin-bottom:2px}
/* textos */
#prompt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;padding:8px 18px;background:var(--panel);border:1px solid rgba(232,145,63,.45);font-size:17px;pointer-events:auto;cursor:pointer;white-space:nowrap;z-index:7}
#prompt kbd{font-family:var(--display);color:var(--ember)}
body.touch #prompt{bottom:auto;top:calc(64px + env(safe-area-inset-top,0px))}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 32px);font-size:16px;color:var(--gold);text-align:center;text-shadow:0 1px 3px #000;opacity:0;transition:opacity .4s;text-wrap:balance}
#toast.show{opacity:1}
body.touch #toast{bottom:auto;top:calc(110px + env(safe-area-inset-top,0px))}
#tut{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));max-width:min(640px,calc(100vw - 32px));font-size:16px;color:var(--bone);text-align:center;text-shadow:0 1px 3px #000,0 0 10px #000;opacity:0;transition:opacity .8s;text-wrap:balance}
#tut.show{opacity:1} #tut b{color:var(--ember);font-weight:600}
#area{display:grid;place-items:center;align-content:center;opacity:0;transition:opacity 1.4s}
#area.show{opacity:1}
#area .s{font-size:clamp(13px,1.7vw,17px);letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
#area .n{font-family:var(--display);font-size:clamp(30px,5.4vw,58px);letter-spacing:.06em;text-shadow:0 2px 12px #000;text-align:center;max-width:calc(100vw - 32px)}
#area .orn{width:min(340px,60vw);height:14px;margin-top:6px;background:linear-gradient(90deg,transparent,rgba(230,220,200,.55) 30%,rgba(230,220,200,.55) 70%,transparent) center/100% 1px no-repeat}
#area .orn::after{content:'';display:block;width:8px;height:8px;margin:3px auto 0;border:1px solid rgba(230,220,200,.7);transform:rotate(45deg);background:#000}
#banner{display:grid;place-items:center;opacity:0;transition:opacity 1.1s ease}
#banner.show{opacity:1}
#banner span{display:block;width:100%;text-align:center;padding:clamp(14px,3vh,28px) 0;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.82) 22%,rgba(0,0,0,.82) 78%,rgba(0,0,0,0));font-family:var(--display);font-size:clamp(30px,7vw,74px);letter-spacing:.07em;line-height:1}
#banner.show span{animation:grow 3.6s ease-out both}
@keyframes grow{from{transform:scale(.94);letter-spacing:.02em}to{transform:scale(1);letter-spacing:.08em}}
#banner.red span{color:#c22a1f;text-shadow:0 0 24px rgba(150,20,10,.45)}
#banner.ember span{color:var(--ember);text-shadow:0 0 24px rgba(228,140,62,.35)}
#banner.gold span{color:var(--gold);text-shadow:0 0 24px rgba(212,178,106,.35)}
/* título de chefe ao estilo dos cartazes: pequeno em cima, nome grande por baixo */
#btitle{display:grid;align-content:end;justify-items:center;padding-bottom:clamp(60px,16vh,150px);opacity:0;transition:opacity .9s}
#btitle.show{opacity:1}
#btitle .t{font-size:clamp(13px,1.7vw,17px);letter-spacing:.28em;text-transform:uppercase;color:var(--dim);text-shadow:0 1px 4px #000}
#btitle .n{font-family:var(--display);font-size:clamp(34px,6.4vw,70px);letter-spacing:.05em;text-shadow:0 2px 14px #000;text-align:center;max-width:calc(100vw - 32px);text-wrap:balance;line-height:1.05}
#btitle .e{font-size:clamp(14px,1.9vw,19px);font-style:italic;color:var(--bone);opacity:.85;text-shadow:0 1px 4px #000;margin-top:4px}
#btitle.phase .n{color:var(--ember)}
#subs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(760px,calc(100vw - 32px));text-align:center;opacity:0;transition:opacity .5s;text-shadow:0 1px 4px #000,0 0 12px #000;z-index:7}
#subs.show{opacity:1}
#subs .w{font-family:var(--display);color:var(--ember);font-size:15px;letter-spacing:.06em}
#subs .l{font-size:clamp(17px,2.3vw,21px);font-style:italic}
body.touch #subs{bottom:auto;top:calc(54px + env(safe-area-inset-top,0px))}
/* caixas */
.box{position:fixed;left:50%;transform:translateX(-50%);width:min(700px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.6);pointer-events:auto;cursor:pointer}
#dialog{top:calc(18px + env(safe-area-inset-top,0px));padding:14px 22px 18px;z-index:15;text-align:center}
#dialog::before,#dialog::after{content:'';position:absolute;left:50%;width:60%;height:1px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(230,220,200,.5),transparent)}
#dialog::before{top:6px} #dialog::after{bottom:6px}
#dwho{font-family:var(--display);color:var(--ember);font-size:17px;letter-spacing:.06em;margin-bottom:6px}
#dtext{font-size:clamp(17px,2.3vw,20px);line-height:1.5;max-width:60ch;margin:0 auto;min-height:3em}
#dtext span{opacity:0;transition:opacity .12s}
#dtext span.v{opacity:1}
.more{position:absolute;right:16px;bottom:10px;font-size:12px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
#itembox{top:50%;transform:translate(-50%,-50%);padding:20px 24px 26px;width:min(560px,calc(100vw - 32px));z-index:16;text-align:center}
#itembox canvas{width:64px;height:64px;display:block;margin:0 auto 6px}
#itembox .kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#iname{font-family:var(--display);font-size:clamp(22px,3.4vw,28px);color:var(--gold);margin:4px 0 10px;text-wrap:balance}
#idesc{font-style:italic;font-size:17px;line-height:1.5;max-height:46vh;overflow:auto}
#idesc .how{display:block;font-style:normal;color:var(--ember);font-size:15px;margin-top:10px}
/* ---------- menus ---------- */
#menu{z-index:20;background:rgba(2,2,4,.82);pointer-events:auto;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#menu.center{justify-content:center;align-items:center}
.tabs{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;flex:none;margin-bottom:8px}
.tab{background:none;border:0;border-bottom:1px solid transparent;padding:6px 12px;font-family:var(--display);font-size:clamp(15px,1.9vw,19px);letter-spacing:.05em;color:var(--dim);cursor:pointer}
.tab.on{color:var(--bone);border-bottom-color:var(--ember)}
.tab:focus-visible{outline:none;color:#fff}
.page{flex:1;min-height:0;display:flex;gap:16px;width:min(1000px,100%);margin:0 auto}
.page .left{flex:1.25;min-width:0;overflow:auto;touch-action:pan-y;overscroll-behavior:contain}
.page .right{flex:1;min-width:0;overflow:auto;touch-action:pan-y;border-left:1px solid var(--line);padding-left:16px}
.page.one .left{flex:1}
.page h3{font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:6px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:6px;margin-bottom:10px}
.slot{position:relative;aspect-ratio:1;background:rgba(255,255,255,.03);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;padding:0}
.slot canvas{width:78%;height:78%}
.slot.empty{opacity:.3;cursor:default}
.slot.sel{border-color:var(--ember);background:rgba(232,145,63,.12)}
.slot.eq::after{content:'';position:absolute;right:4px;top:4px;width:6px;height:6px;border-radius:50%;background:var(--ember)}
.slot .q{position:absolute;right:4px;bottom:2px;font-size:13px;color:var(--bone);text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.det .dn{font-family:var(--display);font-size:clamp(20px,2.8vw,26px);color:var(--gold);margin:4px 0 2px;text-wrap:balance}
.det .dk{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.det .dd{font-size:16px;line-height:1.55;font-style:italic;margin:8px 0}
.det .du{font-size:15px;color:var(--ember);margin:6px 0}
.det canvas.big{width:120px;height:120px;display:block;margin:6px auto}
.det .act{display:inline-block;margin-top:8px;padding:6px 14px;border:1px solid var(--ember);background:rgba(232,145,63,.12);cursor:pointer;font-size:15px}
.list .li{display:flex;justify-content:space-between;gap:10px;width:100%;background:none;border:0;border-top:1px solid rgba(230,220,200,.07);padding:8px 6px;text-align:left;cursor:pointer;font-size:16px}
.list .li.sel{background:rgba(232,145,63,.1);box-shadow:inset 3px 0 0 var(--ember)}
.list .li .r{color:var(--dim);font-size:14px}
.list .li.lock{opacity:.4}
#mapc{width:100%;height:100%;display:block}
.stat{display:flex;justify-content:space-between;border-top:1px solid rgba(230,220,200,.07);padding:7px 4px;font-size:16px}
.stat .r{color:var(--gold);font-variant-numeric:tabular-nums}
.panel{width:min(480px,100%);max-height:calc(100% - 4px);overflow:auto;background:var(--panel);border:1px solid var(--line);box-shadow:0 16px 50px rgba(0,0,0,.7);padding:18px 20px 12px;touch-action:pan-y;overscroll-behavior:contain}
.panel.wide{width:min(640px,100%)}
.panel h2{font-family:var(--display);font-weight:400;font-size:24px;color:var(--ember);margin:0 0 4px;letter-spacing:.03em;text-wrap:balance}
.panel .sub{margin:0 0 10px;color:var(--dim);font-size:15px}
.panel .copy{font-size:15px;line-height:1.5;margin:4px 0 10px}
.panel .copy h3{font-family:var(--display);font-weight:400;font-size:16px;color:var(--gold);margin:10px 0 3px}
.panel .copy p{margin:0 0 6px}
.mbtn{display:flex;justify-content:space-between;align-items:baseline;gap:16px;width:100%;background:none;border:0;border-top:1px solid rgba(230,220,200,.08);padding:10px 8px;font-size:18px;text-align:left;cursor:pointer}
.mbtn .r{color:var(--dim);font-size:15px;font-variant-numeric:tabular-nums;text-align:right}
.mbtn:hover,.mbtn:focus-visible{background:rgba(232,145,63,.1);color:#fff;outline:none}
.mbtn:focus-visible{box-shadow:inset 3px 0 0 var(--ember)}
.mbtn.off{opacity:.42}
.mbtn .d{display:block;font-size:13px;color:var(--dim);font-style:italic;margin-top:2px}
.close{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px));background:none;border:1px solid var(--line);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1;color:var(--dim)}
@media (max-height:460px){.page h3{margin:2px 0 4px}.grid{grid-template-columns:repeat(auto-fill,minmax(50px,1fr))}.det canvas.big{width:80px;height:80px}.det .dd{font-size:15px}}
@media (orientation:portrait){.page{flex-direction:column}.page .right{border-left:0;border-top:1px solid var(--line);padding:10px 0 0}}
/* ---------- toque ---------- */
#touch{z-index:5}
#stick{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:1.5px solid rgba(230,220,200,.22);background:rgba(0,0,0,.18);opacity:.4;transition:opacity .15s;pointer-events:none}
#stick.on{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(230,220,200,.22);border:1px solid rgba(230,220,200,.32)}
.tb{position:fixed;pointer-events:auto;border-radius:50%;border:1.5px solid rgba(230,220,200,.3);background:rgba(8,7,9,.45);display:grid;place-items:center;padding:0;cursor:pointer;color:var(--bone)}
.tb svg{width:46%;height:46%}
.tb.on{background:rgba(232,145,63,.38);border-color:var(--ember)}
.tb.dim{opacity:.35}
#tAtk{width:78px;height:78px;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px))}
#tJump{width:72px;height:72px;right:calc(108px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#tDash{width:60px;height:60px;right:calc(30px + env(safe-area-inset-right,0px));bottom:calc(114px + env(safe-area-inset-bottom,0px))}
#tHeavy{width:50px;height:50px;right:calc(104px + env(safe-area-inset-right,0px));bottom:calc(100px + env(safe-area-inset-bottom,0px))}
#tSpell{width:52px;height:52px;right:calc(166px + env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#tHeal{width:46px;height:46px;right:calc(190px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px))}
#rot{z-index:40;background:rgba(0,0,0,.92);display:grid;place-items:center;text-align:center;pointer-events:auto;padding:24px}
#rot p{max-width:24ch;font-size:19px;line-height:1.5}
#rot svg{width:64px;height:64px;margin-bottom:10px;animation:rotk 2.4s ease-in-out infinite}
@keyframes rotk{40%,60%{transform:rotate(-90deg)}}
#rot button{margin-top:14px;background:none;border:1px solid var(--line);padding:6px 16px;color:var(--dim);cursor:pointer}
/* ---------- ecrãs ---------- */
.screen{display:grid;place-items:center;pointer-events:auto;text-align:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:18}
#title{align-content:center;background:radial-gradient(ellipse at 50% 90%,rgba(120,50,20,.22),rgba(0,0,0,0) 60%)}
.tcard{display:grid;justify-items:center;gap:4px}
.kicker{margin:0;font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--dim)}
.logo{margin:6px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(42px,min(11vw,16vh),124px);line-height:.95;letter-spacing:.06em;text-shadow:0 0 34px rgba(232,145,63,.28),0 2px 0 #000;text-wrap:balance}
.rule{width:min(260px,60vw);height:1px;background:linear-gradient(90deg,transparent,rgba(232,145,63,.6),transparent);margin:clamp(6px,2vh,14px) 0 clamp(4px,1.5vh,10px)}
.tmenu{display:grid;gap:2px;justify-items:center}
.tbtn{background:none;border:0;font-family:var(--display);font-size:clamp(19px,2.6vw,24px);letter-spacing:.06em;padding:clamp(3px,1vh,8px) 22px;cursor:pointer;opacity:.8;transition:opacity .2s,text-shadow .2s}
.tbtn:hover,.tbtn:focus-visible{opacity:1;outline:none;color:#fff;text-shadow:0 0 14px rgba(232,145,63,.7)}
.tsnd{margin:10px 0 0;font-size:13px;letter-spacing:.1em;color:var(--ember);opacity:.85;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.tfoot{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));margin:0;font-size:13px;color:var(--dim);letter-spacing:.04em;opacity:.8}
@media (max-height:520px){.tfoot{display:none}}
#intro{background:#000;z-index:24}
#itext{max-width:34ch;font-size:clamp(19px,3vw,28px);line-height:1.5;font-style:italic;opacity:0;transition:opacity .9s;text-wrap:balance;margin:0}
#itext.on{opacity:1}
.skip{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:none;border:1px solid var(--line);padding:6px 14px;font-size:14px;color:var(--dim);cursor:pointer;letter-spacing:.08em}

  carta1: { name: 'Carta de Seraphine (I)', cat: 'cartas', icon: 'carta', c: 0xf0e0c0, desc: '«Aldric, meu amor. Hoje o Lume queimou-me as mãos e eu não senti nada. Não chores. Uma chama precisa de algo que arda, e eu escolhi ser eu. Cuida das meninas. Não deixes o Ozias falar-te ao ouvido à noite.»' },
  carta2: { name: 'Carta de Seraphine (II)', cat: 'cartas', icon: 'carta', c: 0xf0e0c0, desc: '«Ione pergunta-me porque brilho à noite. Disse-lhe que guardo uma estrela. Ela quer guardar uma também. Que o Lume nunca a escolha. E se escolher, que ela possa dizer que não. A mim nunca ninguém perguntou.»' },
  carta3: { name: 'Carta de Seraphine (III)', cat: 'cartas', icon: 'carta', c: 0xf0e0c0, desc: '«Se algum dia o Lume se partir, não o reacendas comigo. Deixa-me dormir. Mas se alguém tiver de arder, que seja por escolha, e não por medo. Esse é o único fogo que não se apaga.»' },

  cinza_bendita: { name: 'Cinza Bendita', cat: 'itens', icon: 'cinza', c: 0xf0e8d8, desc: 'Cinza recolhida no altar da rainha. Misturada nos frascos, torna a cura mais forte.' },

  cinzas_pequenas: { name: 'Cinzas de um Desperto', cat: 'itens', icon: 'cinzas', c: 0xc8c0b0, n: 150, use: true, desc: 'Restos de alguém que, como tu, acordou sem saber porquê. Usa-as para ganhar 150 cinzas.' },

const LORE = {
  l_cripta1: { t: 'Inscrição num caixão', x: 'AQUI DORME QUEM SERVIU. O LUME VELA O SEU SONO.\n\nPor baixo, riscado com uma unha: «o lume já não vela nada»' },
  l_cripta2: { t: 'Placa da Ordem do Véu', x: 'A Ordem do Véu canta aos mortos para que não acordem. Cada irmã aprende uma canção só. A Irmã Odile aprendeu a última: a do funeral da rainha. Nunca chegou a acabá-la.' },
  l_cripta3: { t: 'Lápide quebrada', x: 'Os primeiros a acordar choraram. Os segundos tentaram voltar a deitar-se. Os terceiros pegaram nas espadas. Tu és dos terceiros.' },
  l_cripta4: { t: 'Registo do coveiro', x: 'Noite da Separação. Os sinos tocaram sozinhos. Seis luzes cruzaram o céu como estrelas a cair para o lado errado. Às três da manhã, os caixões começaram a bater por dentro.' },
  l_hub1: { t: 'Altar do Santuário', x: 'Aqui ardia uma das mil chamas menores que o Lume acendia em Vesperal. Todas se apagaram na Noite da Separação. Esta não. Uma menina sem olhos guarda-a com as mãos.' },
  l_hub2: { t: 'Estátua da rainha', x: 'SERAPHINE, RECEPTÁCULO DO LUME. ELA ARDE PARA QUE NÓS DURMAMOS.\n\nAlguém pôs flores secas aos pés da estátua. São recentes.' },
  l_hub3: { t: 'Placa da ponte', x: 'Ponte da Catedral. Levantada por ordem do rei na Noite da Separação. Ninguém entra. Ninguém sai.' },
  l_mur1: { t: 'Ordem de serviço', x: 'Por ordem do rei: os guardas que recusaram servir o cálice serão executados ao amanhecer no pátio das execuções. Carrasco: Tobias, filho de Ansel.' },
  l_mur2: { t: 'Gravado na ameia', x: 'Juramos à rainha, não ao rei. Quando ele mandou abrir o Portão ao bispo, a capitã Brigid fechou-o com o próprio corpo. Que o Lume a guarde.' },
  l_mur3: { t: 'Diário de um besteiro', x: 'Já não sei se disparo contra mortos ou contra vivos. Disparo contra o que mexe. A capitã diz que é o que mantém o juramento. A capitã já não fala.' },
  l_pan1: { t: 'Aviso pregado num poste', x: 'NÃO SIGAM AS VELAS. As velas acendem-se sozinhas desde que a senhora Vesper deixou o palácio. As bruxas dizem que ela está a coser o mundo. As bruxas mentem muito.' },
  l_pan2: { t: 'Página molhada', x: 'O véu não separa a vida da morte. Separa quem lembra de quem esquece. Os mortos que esquecem dormem. Os que lembram... acordam. — Vesper, Tratado do Véu' },
  l_pan3: { t: 'Inscrição na capela', x: 'Vesper era a irmã mais nova. Quando o Lume escolheu Seraphine, Vesper prometeu-lhe que teceria um véu tão fino que ninguém sentiria a dor de morrer. Teceu-o. Mas não foi a tempo para a irmã.' },
  l_bos1: { t: 'Marca num tronco', x: 'Riscado com uma faca de caça: «A princesa passou por aqui. Ninguém a segue. — O.»' },
  l_bos2: { t: 'Placa dos caçadores', x: 'Orin, mestre dos caçadores do rei, ensinou a princesa Selene a disparar antes de ela saber escrever. Quando ela fugiu com a brasa, foi ele quem apagou os rastos. O rei mandou-o procurá-la. Ele nunca voltou.' },
  l_bos3: { t: 'Pedra da clareira', x: 'O bosque ardeu numa só noite, mas não caiu. As árvores ficaram brancas, de pé, como ossos. Os lobos ficaram também. Seguem a lua morta.' },
  l_for1: { t: 'Regras da forja', x: 'PRIMEIRA REGRA: O FOGO NÃO PERDOA. SEGUNDA REGRA: O METAL LEMBRA-SE DE TUDO. TERCEIRA REGRA: NUNCA FORJES O QUE NÃO PODES DESFAZER.\n\nA terceira regra foi raspada.' },
  l_for2: { t: 'Encomenda real', x: 'Um cálice de ouro-negro, com selo de prata lunar. Forma pedida pelo bispo Ozias. Pagamento: o perdão de todas as dívidas da guilda. Assinado: Aldric, rei. Assinado por baixo, a tremer: Hilde.' },
  l_for3: { t: 'Nota de Hrolf (antiga)', x: 'Mestra, a fornalha não se apaga. Já atirei água, areia, cinza. Disseram-me que a vossa voz ainda canta lá dentro. Eu não oiço nada. Não quero ouvir nada.' },
  l_cat1: { t: 'Sermão do bispo', x: 'O Lume é de Deus e não de uma mulher. Se a chama pode ser guardada num cálice, pode ser guardada no altar. E o que está no altar pertence à Igreja. — Ozias, último sermão' },
  l_cat2: { t: 'Confissão (rasgada)', x: '...disse ao rei que a rainha não ia sentir nada. Disse-lhe que a chama passaria para o cálice como água de um copo para outro. Sabia que era mentira. Precisava que ele acreditasse...' },
  l_cat3: { t: 'Trono vazio', x: 'O rei Aldric não se sentou no trono desde a Noite da Separação. Fica de pé, ao lado, de espada na mão, a guardar uma cortina. Atrás da cortina não há nada.' },
  l_mur4: { t: 'Juramento da Guarda', x: 'Eu, guarda da rainha, juro: enquanto ela arder, eu velo. Enquanto ela dormir, eu velo. Se ela se apagar, que eu me apague com ela.\n\nPor baixo, noutra letra, mais recente e mais funda, como se a pedra tivesse sido riscada com a ponta de uma lança: «Ela não se apagou. Então eu também não posso.» — B.' },
  l_pan4: { t: 'Bastidor de Vesper', x: 'Num bastidor de bordar, um véu inacabado, tecido com fios de cinza. Em cada fio há um nome cosido: soldados, criadas, crianças, cães. Milhares.\n\nO último nome está a meio: «SERAPH—». A agulha ainda está espetada no pano, e o fio ainda está quente.' },
  l_bos4: { t: 'Acampamento da princesa', x: 'Uma fogueira apagada há muito, um arco partido, uma tigela de água para a loba.\n\nNum tronco, riscado à faca: «Pai, se leres isto, não venhas. A brasa não é tua. Nunca foi. A mãe deu-ma a mim para que tu não a usasses.»\n\nHá muitos riscos a contar os dias. Pararam no centésimo.' },
  l_for4: { t: 'Bigorna da Mestra', x: 'A bigorna está coberta de marcas de martelo que nunca chegaram a formar nada. A mestra Hilde batia no metal para não ouvir os gritos que vinham da catedral.\n\nJunto à fornalha há um molde de cálice, partido ao meio. Não foi partido com um martelo. Foi partido à mão.' },
  l_cat4: { t: 'Livro de contas do bispo', x: 'Cálice de ouro-negro: pago.\nSilêncio do capitão da guarda: comprado.\nSilêncio da capitã Brigid: recusado.\nSilêncio da mestra Hilde: aceite, com lágrimas.\nPerdão do rei: prometido.\nPerdão de Deus: \n\nA última linha está em branco. O bispo deixou de escrever ali muitas vezes: a página está gasta de tanto a apagar.' },
  l_cor3: { t: 'Altar do Lume', x: 'Foi aqui que a rainha bebeu do cálice, na Noite da Separação. O rei segurava-lhe a mão. O bispo rezava. As filhas estavam proibidas de entrar.\n\nQuando a chama saiu dela, não entrou no cálice. Partiu-se em seis e fugiu para aqueles que ela amava: a irmã que cantava, a capitã que a guardava, a irmã que tecia, a filha que caçava, a mestra que a temia, e o homem que a traiu por amor.\n\nNenhuma brasa foi para o bispo.' },
  l_cor1: { t: 'Voz na luz', x: 'Não há inscrições aqui. Há uma voz. Diz sempre a mesma coisa, em todas as línguas: «Estou tão cansada.»' },
  l_cor2: { t: 'Reflexo', x: 'No espelho de luz vês o teu reflexo. Ele não tem máscara. Por baixo da máscara, ele também não tem cara.' },
};

// ===================== MUNDO: entidades das salas =====================
const ENTS = [];
class Ent {
  constructor(o) { Object.assign(this, { layer: 'back' }, o); ENTS.push(this); }
  update(dt) { } draw(c) { } interact() { return null; }
}
function entsClear() { ENTS.length = 0; PLATS.length = 0; ROOM.props = []; }
function nearestInteract() {
  const p = PLAYER; if (!p || !p.alive || !p.onGround || ['dash', 'hurt', 'hazard', 'skill', 'cast', 'busy', 'sit', 'frozen', 'drink'].includes(p.state)) return null;
  let best = null, bd = 1e9;
  for (const e of ENTS) { const it = e.interact(); if (!it) continue; const d = Math.abs(e.x - p.x); if (d > (it.r || 34) || Math.abs((e.y ?? p.y) - p.y) > 50) continue; if (d < bd) { bd = d; best = it; } }
  return best;
}
// adereço estático desenhado no cache dos blocos
function prop(x, y, w, h, bake) { ROOM.props.push({ x: x - w / 2, y: y - h, w, h, bake }); }
// ---------- fogueira ----------
class Bonfire extends Ent {
  constructor(o) { super(o); this.lit = !!PROG.bonfires[this.id]; GAME.bonfires[this.id] = this; if (this.after && !PROG.bossDown[this.after]) this.hiddenUntil = true; }
  update(dt) {
    if (this.hiddenUntil) return; const k = this.lit ? 1 : .25;
    light(this.x, this.y - 18, this.lit ? 260 : 90, 0xff9a40, this.lit ? 1.25 : .5, .15);
    if (this.lit && Math.random() < dt * 22) part({ x: this.x + rnd(-6, 6), y: this.y - 8, vx: rnd(-10, 10), vy: rnd(-70, -30), life: rnd(.6, 1.4), s: rnd(1, 2), s1: .3, color: pick([0xffa040, 0xffd080, 0xff6a20]), glow: true, drag: .5 });
  }
  draw(c) {
    if (this.hiddenUntil) return; const x = this.x, y = this.y, t = G.t;
    c.fillStyle = '#2a2420'; for (let i = 0; i < 7; i++) ell(c, x - 15 + i * 5, y - 2, 4, 3); c.fillStyle = '#4a443e'; ell(c, x, y - 3, 13, 3.5);
    c.save(); c.translate(x + 2, y - 4); c.rotate(-.22); c.fillStyle = '#4a3a2a'; c.fillRect(-1.5, -40, 3, 10); c.fillRect(-5, -31, 10, 2.5); c.fillStyle = '#b8b4ac'; poly(c, [-1.6, -29, 1.6, -29, 1, 0, -1, 0]); c.restore();
    if (this.lit) { c.save(); c.globalCompositeOperation = 'lighter'; for (let i = 0; i < 3; i++) { const f = Math.sin(t * (9 + i * 3) + i) * .5 + .5; c.globalAlpha = .55 - i * .12; c.fillStyle = ['#ff7a20', '#ffb040', '#fff0c0'][i]; c.beginPath(); c.moveTo(x - 9 + i * 3, y - 3); c.quadraticCurveTo(x - 8 + i * 2, y - 16 - f * 4, x + Math.sin(t * 5 + i) * 2, y - 24 + i * 5 - f * 6); c.quadraticCurveTo(x + 8 - i * 2, y - 16 - f * 4, x + 9 - i * 3, y - 3); c.fill(); } c.drawImage(glowSpr(0xff9a40), x - 30, y - 44, 60, 60); c.restore(); }
    else { c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = .4 + Math.sin(t * 2) * .15; c.drawImage(glowSpr(0xff6a20), x - 10, y - 14, 20, 20); c.restore(); }
  }
  interact() { if (this.hiddenUntil || GAME.boss) return null; return { label: this.lit ? 'Descansar' : 'Acender a fogueira', r: 30, act: () => GAME.useBonfire(this) }; }
  reveal() { this.hiddenUntil = false; burst(this.x, this.y - 10, 40, { color: [0xffa040, 0xffd080], smin: 40, smax: 200, dir: -HPI, spread: 1.2 }); }
}

class Pickup extends Ent {

  draw(c) { if (this.taken) return; const b = Math.sin(G.t * 3 + this.ph) * 2; c.save(); c.globalCompositeOperation = 'lighter'; c.drawImage(glowSpr(0xfff0d0), this.x - 16, this.y - 26 + b, 32, 32); c.fillStyle = '#fffaf0'; ell(c, this.x, this.y - 10 + b, 2.2, 2.2); c.restore(); }

// ---------- baú ----------
class Chest extends Ent {
  constructor(o) { super(o); this.open = !!PROG.picked[this.id]; this.lidA = this.open ? 1 : 0; }
  update(dt) { if (this.opening) { this.lidA = Math.min(1, this.lidA + dt * 3); } }

    const x = this.x, y = this.y; c.fillStyle = '#3a2a1c'; c.fillRect(x - 14, y - 16, 28, 16); c.fillStyle = '#6a6052'; c.fillRect(x - 14, y - 11, 28, 2.5); c.fillRect(x - 2, y - 14, 4, 6);
    c.save(); c.translate(x - 14, y - 16); c.rotate(-this.lidA * 1.9); c.fillStyle = '#4a3624'; c.beginPath(); c.moveTo(0, 0); c.lineTo(28, 0); c.quadraticCurveTo(28, -9, 14, -9); c.quadraticCurveTo(0, -9, 0, 0); c.fill(); c.restore();
    if (!this.open) { c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = .25 + Math.sin(G.t * 2) * .1; c.drawImage(glowSpr(0xffd080), x - 14, y - 26, 28, 28); c.restore(); }

// ---------- portas e grades (ocupam células, código 12) ----------
function setBlock(tx, ty0, h, on) { for (let i = 0; i < h; i++) { const R = ROOM.cur; const ty = ty0 - i; if (tx >= 0 && ty >= 0 && tx < R.w && ty < R.h) R.g[ty * R.w + tx] = on ? 12 : 0; } }
class Door extends Ent {
  // porta: key (chave), oneWay (1: só abre pela direita; -1: pela esquerda), need (função), boss: grade de arena
  constructor(o) { super(o); this.h = this.hh || 3; this.tx = Math.floor(this.x / T); this.ty = Math.floor((this.y - 1) / T); this.isOpen = !!(PROG.flags['door_' + this.id] || this.startOpen); this.k = this.isOpen ? 1 : 0; setBlock(this.tx, this.ty, this.h, !this.isOpen); }
  setOpen(v, instant) { this.isOpen = v; setBlock(this.tx, this.ty, this.h, !v); if (v && this.id && !this.temp) PROG.flags['door_' + this.id] = 1; if (instant) this.k = v ? 1 : 0; else { sfx(this.gate ? 'stone' : 'door', at(this, .8, { rate: this.gate ? .7 : .8 })); if (this.gate) sfx('rumble', at(this, .5)); } }
  update(dt) { this.k = approach(this.k, this.isOpen ? 1 : 0, dt * (this.gate ? 1.2 : 2)); }
  draw(c) {
    const X = this.tx * T, Y = (this.ty + 1) * T, H = this.h * T;
    if (this.gate) { const lift = this.k * (H - 6); c.fillStyle = '#2a2a30'; for (let i = 0; i < 4; i++) c.fillRect(X + 3 + i * 8, Y - H - lift, 3, H); c.fillRect(X, Y - H - lift + 8, T, 3); c.fillRect(X, Y - H / 2 - lift, T, 3); c.fillStyle = '#4a4a54'; for (let i = 0; i < 4; i++) poly(c, [X + 2 + i * 8, Y - lift, X + 4.5 + i * 8, Y + 5 - lift, X + 7 + i * 8, Y - lift]); return; }
    const w = T * (1 - this.k * .85); c.fillStyle = '#2e2218'; c.fillRect(X + (T - w) / 2, Y - H, w, H); c.fillStyle = '#1a140e'; for (let i = 1; i < 4; i++) c.fillRect(X + (T - w) / 2 + w * i / 4, Y - H, 1.2, H);
    c.fillStyle = '#5a5248'; c.fillRect(X + (T - w) / 2, Y - H * .78, w, 3); c.fillRect(X + (T - w) / 2, Y - H * .28, w, 3);
    if (this.key && !this.isOpen) { c.fillStyle = '#8a7a50'; ell(c, X + T / 2, Y - H * .5, 3, 3); }
  }
  interact() {
    if (this.isOpen || this.gate) return null; const p = PLAYER, side = Math.sign(p.x - this.x);
    if (this.oneWay && side !== this.oneWay) return { label: 'Não abre deste lado', r: 30, act: () => { UI.toast('Está trancada pelo outro lado.'); synth('ui'); } };
    if (this.key && !PROG.keys[this.key]) return { label: 'Trancada', r: 30, act: () => { UI.toast('Precisas de: ' + (ITEMS[this.key] ? ITEMS[this.key].name : 'uma chave') + '.'); synth('ui'); } };
    if (this.need && !this.need()) return { label: this.needLabel || 'Selada', r: 30, act: () => { UI.toast(this.needMsg || 'Uma força antiga sela esta porta.'); synth('ui'); } };
    return { label: 'Abrir', r: 30, act: () => { PLAYER.busy(.6, 'push'); after(.3, () => { this.setOpen(true); if (this.key) UI.toast('Usaste: ' + ITEMS[this.key].name); }); } };
  }
}
class Lever extends Ent {
  constructor(o) { super(o); this.pulled = !!PROG.flags['door_' + this.door]; this.a = this.pulled ? 1 : 0; }

}
